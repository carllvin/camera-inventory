# Camera Inventory — the only compose file you need (Dockge, Portainer or `docker compose`).
# Pulls ready-made images from GitHub Container Registry; nothing is built on your server.
#
#   1. Put this file in a folder (or paste it into Dockge) and create .env next to it
#      with at least POSTGRES_PASSWORD, BETTER_AUTH_SECRET and PUBLIC_URL
#      (see compose.env.example in the repository).
#   2. docker compose up -d          → http://<server>:3000
#   3. Update: docker compose pull && docker compose up -d   (Dockge: "Update")
#
# The app container applies database migrations and fixes the permissions of the
# storage volume itself when it starts. HTTPS: point your reverse proxy
# (Nginx Proxy Manager, Traefik, Caddy …) at port ${APP_PORT:-3000}.
# Back up both volumes: pgdata (database) and storage (photos and documents).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: camera_inventory
      POSTGRES_USER: camera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camera -d camera_inventory"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ghcr.io/carllvin/camera-inventory:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://camera:${POSTGRES_PASSWORD}@postgres:5432/camera_inventory
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:3000}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      # AI reading of delivery/return notes; leave empty to enter documents by hand
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
      # Image search for equipment reference images (optional)
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      # true: Claude checks image results (needs ANTHROPIC_API_KEY); default: first result
      IMAGE_AI_RANKING: ${IMAGE_AI_RANKING:-false}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage
    volumes:
      - storage:/app/storage
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  storage:
