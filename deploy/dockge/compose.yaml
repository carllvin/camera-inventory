# Camera Inventory — pull-only stack for Dockge / Portainer / plain `docker compose`.
# No source code needed on the server: images are built by GitHub Actions and
# pulled from GitHub Container Registry. Paste this file and the .env into Dockge.
#
# Update: Dockge "Update" (or `docker compose pull && docker compose up -d`).
# HTTPS:  set COMPOSE_PROFILES=proxy and DOMAIN in .env to start the bundled Caddy,
#         or point your existing reverse proxy at port ${APP_PORT:-3000}.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: camera_inventory
      POSTGRES_USER: camera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camera -d camera_inventory"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ghcr.io/carllvin/camera-inventory-migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://camera:${POSTGRES_PASSWORD}@postgres:5432/camera_inventory
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # One-shot: make the storage volume writable for the app user (uid 1001).
  # Needed when the volume or a bind-mounted folder was created owned by root.
  storage-permissions:
    image: busybox:1
    user: "0:0"
    command: ["chown", "-R", "1001:1001", "/app/storage"]
    volumes:
      - storage:/app/storage
    restart: "no"

  app:
    image: ghcr.io/carllvin/camera-inventory:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://camera:${POSTGRES_PASSWORD}@postgres:5432/camera_inventory
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:3000}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      # AI reading of delivery/return notes; leave empty to enter documents by hand
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-high}
      # Image search for equipment reference images (optional)
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage
    volumes:
      - storage:/app/storage
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      storage-permissions: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      app: { condition: service_healthy }

volumes:
  pgdata:
  storage:
  caddy_data:
